# Legend of the Green Dragon - Resurrection: sample nginx server for the game (docs/HOST-GUIDE.md).
#
# A SAMPLE, NOT ACTIVE. Nothing in the game reads this file. Copy it into your nginx configuration (for example
# /etc/nginx/sites-available/resurrection.conf), change the lines marked CHANGE, then run `nginx -t` before reloading.
#
# It assumes the game is the whole site, served from its own folder (the docroot), and PHP-FPM 8.4 or 8.5. For a game
# in a sub-folder of a larger site, put that folder's name in front of each refused path below.
#
# What it does: serves the game over HTTPS only; refuses every path on the guide's deny list with a plain 404 before
# PHP or the file system sees the request; sends every other .php request that names a real file to PHP-FPM.

server {
    listen 80;
    # With IPv6 on the server, also: listen [::]:80;
    server_name game.example.org;                                   # CHANGE: your site's name
    # Certificate renewals (ACME HTTP-01) are answered over plain HTTP; everything else moves to HTTPS.
    location ^~ /.well-known/acme-challenge/ { root /srv/resurrection/game; try_files $uri =404; }   # CHANGE: the docroot
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    # With IPv6 on the server, also: listen [::]:443 ssl;
    server_name game.example.org;                                   # CHANGE: your site's name
    ssl_certificate     /etc/ssl/resurrection/fullchain.pem;        # CHANGE: your certificate
    ssl_certificate_key /etc/ssl/resurrection/privkey.pem;          # CHANGE: its key

    root /srv/resurrection/game;                                    # CHANGE: the docroot, the folder holding index.php
    index index.php;
    charset utf-8;
    server_tokens off;
    autoindex off;

    # --- Refused paths (the guide's deny list). Regular-expression locations are tried in the order written, so these
    # --- come before the PHP location. Each answers 404 and never reaches PHP.

    # Dotfiles and dot folders anywhere (.git, .github, .gitignore, .htaccess, .env, .local-play), except
    # /.well-known/, which certificate renewals use.
    location ~ /\.(?!well-known/) { return 404; }

    # The game's internal and development folders.
    location ~* ^/(lib|src|modules|upgrades|scripts|tests|docs|lab|local|vendor|var)(/|$) { return 404; }

    # The configuration file, the table prefix map, the setup token file and its failure counter (PHP reads them from
    # the disk; nobody requests them), and the two PHP files only other pages include.
    location ~* ^/(dbconnect|prefixes|resurrection-setup|resurrection-setup-failures|common|battle)\.php$ { return 404; }

    # Development and project files.
    location ~* ^/(composer\.(json|lock)|project\.json|phpunit\.xml|phpstan[^/]*\.neon)$ { return 404; }

    # Markdown anywhere (README.md, ROADMAP.md, assets/README.md, ...).
    location ~* \.md$ { return 404; }

    # --- Served: the pages, assets/, images/, templates/, the favicons and the license files.

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        # Only a .php file that exists goes to PHP (stops /image.svg/x.php tricks).
        try_files $uri =404;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;                 # CHANGE: your PHP-FPM socket or host:port
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # TLS ends here, so PHP must see HTTPS=on (the game marks its session cookie Secure only then).
        fastcgi_param HTTPS on;
        # Optional (recommended): the configuration file outside the docroot. Remove the # and CHANGE the path. PHP-FPM's
        # own pool setting env[LOGD_DBCONNECT] works as well; set it in one place only.
        # fastcgi_param LOGD_DBCONNECT /srv/resurrection/private/dbconnect.php;
    }
}
