# Legend of the Green Dragon - Resurrection: sample Apache 2.4 virtual host for the game (docs/HOST-GUIDE.md).
#
# A SAMPLE, NOT ACTIVE. Nothing in the game reads this file. Copy it into your Apache configuration (for example
# /etc/apache2/sites-available/resurrection.conf), change the line under each CHANGE comment, then run `apachectl -t` (or
# `apache2ctl -t`) before reloading. On shared hosting where you cannot edit the server's configuration, use the
# .htaccess form instead: docs/hosting/htaccess.
#
# It assumes the game is the whole site, served from its own folder (the docroot), with PHP through mod_php or through
# PHP-FPM (mod_proxy_fcgi). Every block that needs an optional module is wrapped, so a missing module skips the block
# instead of stopping Apache; the refusals need only mod_authz_core, which every Apache 2.4 has.
#
# What it does: serves the game over HTTPS only; refuses every path on the guide's deny list (403) before PHP sees the
# request; turns directory listings off.

# CHANGE: the docroot, the folder holding index.php
Define RESURRECTION_ROOT /srv/resurrection/game

# The folder's rules. They sit outside the virtual hosts, so both (HTTP and HTTPS) use them, and they name only the
# game's folder, so other sites on the server are not touched.

<Directory "${RESURRECTION_ROOT}">
    Options -Indexes
    AllowOverride None
    Require all granted
    DirectoryIndex index.php

    # PHP through PHP-FPM. With mod_php instead, leave this block as it is: it is skipped when mod_proxy_fcgi is not
    # loaded, and mod_php's own configuration handles .php.
    <IfModule mod_proxy_fcgi.c>
        <FilesMatch "\.php$">
            # CHANGE: your PHP-FPM socket
            SetHandler "proxy:unix:/run/php/php8.4-fpm.sock|fcgi://localhost"
        </FilesMatch>
    </IfModule>

    # --- Refused files (the guide's deny list), in this folder and every folder under it. Each answers 403.

    # Dotfiles anywhere (.gitignore, .htaccess, .env).
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # The configuration file, the table prefix map, the setup token file and its failure counter (PHP reads them
    # from the disk; nobody requests them), the two PHP files only other pages include, development and project
    # files, and Markdown anywhere.
    <FilesMatch "^(?i:(dbconnect|prefixes|resurrection-setup|resurrection-setup-failures|common|battle)\.php|composer\.(json|lock)|project\.json|phpunit\.xml|phpstan[^/]*\.neon|[^/]*\.md)$">
        Require all denied
    </FilesMatch>
</Directory>

# --- Refused folders (the guide's deny list). Each answers 403 and never reaches PHP.

# Dot folders anywhere (.git, .github, .local-play), except .well-known/, which certificate renewals use.
<DirectoryMatch "^${RESURRECTION_ROOT}/(.+/)?\.(?!well-known(/|$))">
    Require all denied
</DirectoryMatch>

# The game's internal and development folders.
<DirectoryMatch "^${RESURRECTION_ROOT}/(?i:lib|src|modules|upgrades|scripts|tests|docs|lab|local|vendor|var)(/|$)">
    Require all denied
</DirectoryMatch>

<VirtualHost *:80>
    # CHANGE: your site's name
    ServerName game.example.org
    DocumentRoot "${RESURRECTION_ROOT}"
    # Everything but certificate renewals (ACME HTTP-01) moves to HTTPS.
    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteCond "%{REQUEST_URI}" "!^/\.well-known/acme-challenge/"
        RewriteRule "^" "https://%{SERVER_NAME}%{REQUEST_URI}" [R=301,L]
    </IfModule>
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    # CHANGE: your site's name
    ServerName game.example.org
    DocumentRoot "${RESURRECTION_ROOT}"
    SSLEngine on
    # CHANGE: your certificate
    SSLCertificateFile    /etc/ssl/resurrection/fullchain.pem
    # CHANGE: its key
    SSLCertificateKeyFile /etc/ssl/resurrection/privkey.pem
    # mod_ssl sets HTTPS=on for PHP, which the game needs before it marks its session cookie Secure.

    # Optional (recommended): the configuration file outside the docroot (mod_env). Remove the # and CHANGE the path.
    # <IfModule mod_env.c>
    #     SetEnv LOGD_DBCONNECT /srv/resurrection/private/dbconnect.php
    # </IfModule>
</VirtualHost>
</IfModule>
