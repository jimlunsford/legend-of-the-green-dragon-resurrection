; Local play only (Phase 4 task 3), on top of PHP's php.ini-production (local/Dockerfile). Settings from
; docs/MODERN-INSTALLATION.md; mail never leaves the container.
display_errors = Off
log_errors = On
error_reporting = E_ALL
zend.exception_ignore_args = On
expose_php = Off
memory_limit = 256M
session.save_path = /tmp
sendmail_path = /bin/true
date.timezone = UTC
